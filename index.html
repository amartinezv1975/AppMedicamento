<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f8a7e">
  <title>VetDosis</title>
  <link rel="icon" href="img/logo-vetdosis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/storage.js"></script>
  <script src="js/sesion.js"></script>
</head>
<body data-pagina="inicio">
  <div class="vd-app">
    <header class="vd-app__encabezado">
      <button type="button" id="btn-abrir-menu" class="vd-boton-menu" aria-label="Abrir menú"
              aria-expanded="false" aria-controls="sec-menu-lateral">
        <span class="vd-boton-menu__barra"></span>
        <span class="vd-boton-menu__barra"></span>
        <span class="vd-boton-menu__barra"></span>
      </button>
      <img src="img/logo-vetdosis.svg" alt="" class="vd-app__logo">
      <div>
        <h1 class="vd-app__titulo">VetDosis</h1>
        <p class="vd-app__subtitulo">Cálculo de medicamentos por peso</p>
      </div>
    </header>

    <main class="vd-app__contenido">
      <div class="vd-presentacion">
        <div class="vd-presentacion__texto">
          <h2>Bienvenido</h2>
          <p>Elige una opción aquí o desde el menú ☰.</p>
        </div>
        <span class="vd-presentacion__icono" aria-hidden="true">🐾</span>
      </div>

      <a href="clasificaciones.html" class="vd-tarjeta-opcion">
        <span class="vd-tarjeta-opcion__icono" aria-hidden="true">🏷️</span>
        <span class="vd-tarjeta-opcion__texto">
          <strong class="vd-tarjeta-opcion__titulo">Clasificaciones</strong>
          <span>Agrupa los medicamentos por tipo.</span>
          <small id="lbl-total-clasificaciones" class="vd-tarjeta-opcion__total"></small>
        </span>
        <span class="vd-tarjeta-opcion__flecha" aria-hidden="true">›</span>
      </a>

      <a href="medicamentos.html" class="vd-tarjeta-opcion">
        <span class="vd-tarjeta-opcion__icono" aria-hidden="true">💉</span>
        <span class="vd-tarjeta-opcion__texto">
          <strong class="vd-tarjeta-opcion__titulo">Medicamentos</strong>
          <span>Registra los medicamentos de uso veterinario.</span>
          <small id="lbl-total-medicamentos" class="vd-tarjeta-opcion__total"></small>
        </span>
        <span class="vd-tarjeta-opcion__flecha" aria-hidden="true">›</span>
      </a>

      <div class="vd-tarjeta-opcion vd-tarjeta-opcion--desactivada" aria-disabled="true">
        <span class="vd-tarjeta-opcion__icono" aria-hidden="true">🐾</span>
        <span class="vd-tarjeta-opcion__texto">
          <strong class="vd-tarjeta-opcion__titulo">Calcular dosis</strong>
          <span>Próximamente.</span>
        </span>
      </div>
    </main>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
